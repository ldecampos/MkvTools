name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Vendoring: mkvmerge (both apps) + ffmpeg (Merger only, for sync) ────────

      - name: Vendor binaries (macOS)
        if: matrix.platform == 'mac'
        run: |
          brew install mkvtoolnix ffmpeg dylibbundler
          BREW=$(brew --prefix)

          # dylibbundler 1.0.5 adds the '@executable_path/libs/' LC_RPATH twice,
          # which makes dyld refuse to load the binary ("duplicate LC_RPATH").
          # Collapse it to a single entry, then re-sign ad-hoc — dylibbundler's
          # rewrite plus this fix invalidate the signature, and an unsigned
          # binary would be killed by Gatekeeper on a clean Mac.
          fix_vendor_binary() {
            local bin="$1"
            while install_name_tool -delete_rpath '@executable_path/libs/' "$bin" 2>/dev/null; do :; done
            install_name_tool -add_rpath '@executable_path/libs/' "$bin"
            codesign --force --sign - "$bin"
          }

          # mkvmerge → both apps. dylibbundler copies every non-system dylib into
          # vendor/libs and rewrites the install names to @executable_path/libs,
          # so the binary runs on a clean Mac without Homebrew installed.
          for app in apps/remuxer apps/merger; do
            mkdir -p "$app/vendor"
            cp "$BREW/bin/mkvmerge" "$app/vendor/mkvmerge"
            chmod +x "$app/vendor/mkvmerge"
            dylibbundler -cd -of -b -x "$app/vendor/mkvmerge" -d "$app/vendor/libs" -p '@executable_path/libs/'
            codesign --force --sign - "$app/vendor/libs/"*.dylib
            fix_vendor_binary "$app/vendor/mkvmerge"
          done
          # ffmpeg → Merger only (audio sync detection), made self-contained too.
          cp "$BREW/bin/ffmpeg" "apps/merger/vendor/ffmpeg"
          chmod +x "apps/merger/vendor/ffmpeg"
          dylibbundler -cd -of -b -x "apps/merger/vendor/ffmpeg" -d "apps/merger/vendor/libs" -p '@executable_path/libs/'
          codesign --force --sign - "apps/merger/vendor/libs/"*.dylib
          fix_vendor_binary "apps/merger/vendor/ffmpeg"

          # Smoke test: a duplicate LC_RPATH, a missing dylib or a broken
          # signature makes dyld refuse to launch. Run the vendored binaries so
          # such breakage fails the build instead of shipping a dead app.
          ./apps/remuxer/vendor/mkvmerge --version
          ./apps/merger/vendor/mkvmerge --version
          ./apps/merger/vendor/ffmpeg -version

      - name: Vendor binaries (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          choco install mkvtoolnix --no-progress -y
          $src = "C:\Program Files\MKVToolNix\mkvmerge.exe"
          foreach ($app in @("apps\remuxer", "apps\merger")) {
            New-Item -ItemType Directory -Force "$app\vendor" | Out-Null
            Copy-Item $src "$app\vendor\mkvmerge.exe"
          }
          # Static ffmpeg (single self-contained .exe) for the Merger.
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          $ff = Get-ChildItem -Recurse ffmpeg_dl -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ff.FullName "apps\merger\vendor\ffmpeg.exe"

          # Smoke test the vendored binaries from an empty PATH, so a missing
          # DLL surfaces here instead of on the user's machine. $env:SystemRoot
          # is kept so the loader can still find the core Windows DLLs.
          $env:PATH = "$env:SystemRoot\System32"
          & ".\apps\remuxer\vendor\mkvmerge.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "vendored mkvmerge.exe failed to run" }
          & ".\apps\merger\vendor\ffmpeg.exe" -version
          if ($LASTEXITCODE -ne 0) { throw "vendored ffmpeg.exe failed to run" }

      - name: Vendor binaries (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mkvtoolnix xz-utils patchelf

          # Ubuntu's mkvmerge is dynamically linked against libmatroska/libebml/…
          # which are absent on a machine without MKVToolNix. Bundle every
          # non-core shared library next to the binary and point its rpath at
          # them (the Linux analogue of dylibbundler on macOS). glibc and the
          # dynamic loader are intentionally left to the host to avoid ABI
          # mismatches.
          bundle_elf_libs() {
            local bin="$1" libdir="$2"
            mkdir -p "$libdir"
            ldd "$bin" | awk '/=> \//{print $3}' | while read -r lib; do
              case "$(basename "$lib")" in
                ld-linux*|libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|libresolv.so*) continue ;;
              esac
              cp -n "$lib" "$libdir/" || true
            done
            # DT_RUNPATH is not transitive, so set a (transitive) DT_RPATH on the
            # binary and an $ORIGIN rpath on every bundled lib — that way a lib
            # pulling in another bundled lib (e.g. libmatroska → libicui18n) still
            # resolves it from the same folder.
            patchelf --force-rpath --set-rpath '$ORIGIN/libs' "$bin"
            for lib in "$libdir"/*.so*; do
              [ -f "$lib" ] && patchelf --force-rpath --set-rpath '$ORIGIN' "$lib" 2>/dev/null || true
            done
          }

          for app in apps/remuxer apps/merger; do
            mkdir -p "$app/vendor"
            cp "$(which mkvmerge)" "$app/vendor/mkvmerge"
            chmod +x "$app/vendor/mkvmerge"
            bundle_elf_libs "$app/vendor/mkvmerge" "$app/vendor/libs"
          done
          # Static ffmpeg (self-contained) for the Merger. Use the GitHub-hosted
          # BtbN build — johnvansickle.com is a single host that is frequently
          # unavailable and silently serves error pages. -f makes curl fail on
          # HTTP errors instead of writing a non-tar body.
          curl -fL --retry 3 --retry-delay 5 \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            -o ffmpeg.tar.xz
          tar xf ffmpeg.tar.xz
          cp "$(find . -type f -path '*/bin/ffmpeg' | head -1)" apps/merger/vendor/ffmpeg
          chmod +x apps/merger/vendor/ffmpeg

          # Prove self-containment: run the vendored mkvmerge in a clean Ubuntu
          # container that has NO MKVToolNix installed. If a library is missing
          # this fails the build instead of shipping a broken Linux app.
          docker run --rm -v "$PWD/apps/remuxer/vendor:/v:ro" ubuntu:24.04 /v/mkvmerge --version

      # ── Build ──────────────────────────────────────────────────────────────────

      - name: Build Remuxer
        run: pnpm --filter mkv-remuxer exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Merger
        run: pnpm --filter mkv-merger exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Artifacts ─────────────────────────────────────────────────────────────

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/remuxer/dist/*.dmg
            apps/remuxer/dist/*.exe
            apps/remuxer/dist/*.AppImage
            apps/remuxer/dist/*.deb
            apps/merger/dist/*.dmg
            apps/merger/dist/*.exe
            apps/merger/dist/*.AppImage
            apps/merger/dist/*.deb
          if-no-files-found: error
          retention-days: 14

  # ── Publish GitHub Release (only on v* tags) ──────────────────────────────────

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    name: Publish Release
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## MKV Tools ${{ github.ref_name }}

            ### MKV Remuxer
            Remux MKV files: pick the best audio and subtitle tracks and produce a clean output.

            ### MKV Merger
            Merge tracks from 2+ MKV sources: choose which source provides video and pick any audio/subtitle tracks from each source.

            ---
            **macOS**: download the `.dmg` (Apple Silicon / `arm64`).
            **Windows**: download the `.exe` installer.
            **Linux**: download the `.AppImage` or `.deb`.
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

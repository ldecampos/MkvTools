name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-13
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Vendoring: mkvmerge (both apps) + ffmpeg (Merger only, for sync) ────────

      - name: Vendor binaries (macOS)
        if: matrix.platform == 'mac'
        run: |
          brew install mkvtoolnix ffmpeg dylibbundler
          BREW=$(brew --prefix)
          # mkvmerge → both apps. dylibbundler copies every non-system dylib into
          # vendor/libs and rewrites the install names to @executable_path/libs,
          # so the binary runs on a clean Mac without Homebrew installed.
          for app in apps/remuxer apps/merger; do
            mkdir -p "$app/vendor"
            cp "$BREW/bin/mkvmerge" "$app/vendor/mkvmerge"
            chmod +x "$app/vendor/mkvmerge"
            dylibbundler -of -b -x "$app/vendor/mkvmerge" -d "$app/vendor/libs" -p '@executable_path/libs/'
          done
          # ffmpeg → Merger only (audio sync detection), made self-contained too.
          cp "$BREW/bin/ffmpeg" "apps/merger/vendor/ffmpeg"
          chmod +x "apps/merger/vendor/ffmpeg"
          dylibbundler -of -b -x "apps/merger/vendor/ffmpeg" -d "apps/merger/vendor/libs" -p '@executable_path/libs/'

      - name: Vendor binaries (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          choco install mkvtoolnix --no-progress -y
          $src = "C:\Program Files\MKVToolNix\mkvmerge.exe"
          foreach ($app in @("apps\remuxer", "apps\merger")) {
            New-Item -ItemType Directory -Force "$app\vendor" | Out-Null
            Copy-Item $src "$app\vendor\mkvmerge.exe"
          }
          # Static ffmpeg (single self-contained .exe) for the Merger.
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_dl
          $ff = Get-ChildItem -Recurse ffmpeg_dl -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ff.FullName "apps\merger\vendor\ffmpeg.exe"

      - name: Vendor binaries (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mkvtoolnix xz-utils
          for app in apps/remuxer apps/merger; do
            mkdir -p "$app/vendor"
            cp "$(which mkvmerge)" "$app/vendor/mkvmerge"
            chmod +x "$app/vendor/mkvmerge"
          done
          # Static ffmpeg (single self-contained binary) for the Merger.
          curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg.tar.xz
          tar xf ffmpeg.tar.xz
          cp ffmpeg-*-amd64-static/ffmpeg apps/merger/vendor/ffmpeg
          chmod +x apps/merger/vendor/ffmpeg

      # ── Build ──────────────────────────────────────────────────────────────────

      - name: Build Remuxer
        run: pnpm --filter mkv-remuxer build:${{ matrix.platform }} -- --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Merger
        run: pnpm --filter mkv-merger build:${{ matrix.platform }} -- --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Artifacts ─────────────────────────────────────────────────────────────

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/remuxer/dist/*.dmg
            apps/remuxer/dist/*.exe
            apps/remuxer/dist/*.AppImage
            apps/remuxer/dist/*.deb
            apps/merger/dist/*.dmg
            apps/merger/dist/*.exe
            apps/merger/dist/*.AppImage
            apps/merger/dist/*.deb
          if-no-files-found: warn
          retention-days: 14

  # ── Publish GitHub Release (only on v* tags) ──────────────────────────────────

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    name: Publish Release
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## MKV Tools ${{ github.ref_name }}

            ### MKV Remuxer
            Remux MKV files: pick the best audio and subtitle tracks and produce a clean output.

            ### MKV Merger
            Merge tracks from 2+ MKV sources: choose which source provides video and pick any audio/subtitle tracks from each source.

            ---
            **macOS**: download the `.dmg` matching your chip — `arm64` (Apple Silicon) or `x64` (Intel).
            **Windows**: download the `.exe` installer.
            **Linux**: download the `.AppImage` or `.deb`.
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
